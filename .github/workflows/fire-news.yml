name: Fire news for briefing
# 평일 06:40 · 07:00(KST) 에 '전날 18:00~당일 07:00' 소방 뉴스 3개를 골라 DB 에 넣고, 이미 올라간 그날 브리핑 글에도 붙인다.
# 두 번 도는 이유: 06:40 결과로 07:00 브리핑에 뉴스가 실리고, 07:00 결과로 창(07:00까지)이 완성된다. GitHub 예약은 몇 분~수십 분 늦을 수 있다.
on:
  schedule:
    - cron: '40 21 * * 0-4'   # UTC 21:40 = KST 06:40 (월~금)
    - cron: '0 22 * * 0-4'    # UTC 22:00 = KST 07:00
  workflow_dispatch:
  push:                        # 뉴스 선별 코드나 이 파일이 바뀌면 바로 한 번 실행(테스트 겸)
    branches: [main]
    paths: ['server/fire_news.py', '.github/workflows/fire-news.yml']

concurrency:
  group: fire-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 뉴스 고르기
        id: pick
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          python3 server/fire_news.py --date "$DAY" --json > news.json
          echo "## 소방 뉴스 ($DAY, 전날 18:00~07:00 KST)" >> "$GITHUB_STEP_SUMMARY"
          python3 server/fire_news.py --date "$DAY" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          [ "$(cat news.json)" != "[]" ] || { echo "- (창 안의 기사가 없거나 RSS 실패)" >> "$GITHUB_STEP_SUMMARY"; echo "::warning::뉴스를 고르지 못했습니다(창 안의 기사 없음 또는 RSS 실패)"; }
          echo "count=$(python3 -c "import json;print(len(json.load(open('news.json'))))")" >> "$GITHUB_OUTPUT"
          python3 -c "import json; [print(f\"::notice title=소방 뉴스 {i}::{t['title']} ({t['press']}, {t['time']}, 언론사 {t.get('outlets',1)}곳) {t['url']}\") for i, t in enumerate(json.load(open('news.json')), 1)]"   # 실행 화면 위쪽 주석으로도 보이게
      - name: 고른 기사 보관(아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: fire-news-${{ steps.pick.outputs.day }}
          path: news.json
          retention-days: 7
      - name: DB 에 넣고 오늘 브리핑에 붙이기
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          DAY: ${{ steps.pick.outputs.day }}
        run: |
          if [ -z "$PGURL" ]; then echo "- Secret SUPABASE_DB_URL 이 없어 DB 에 넣지 않음" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          set -o pipefail
          sudo apt-get install -y -q postgresql-client >/dev/null 2>&1 || true
          # -c 에서는 psql 변수(:'x')가 치환되지 않으므로 SQL 파일로 만들어 -f 로 실행. JSON 은 달러 인용으로 그대로 넣는다
          printf "select 'briefings updated: ' || public.ictc_news_set('%s'::date, \$news\$%s\$news\$::jsonb);\n" "$DAY" "$(cat news.json)" > set_news.sql
          OUT=$(psql "$PGURL" -v ON_ERROR_STOP=1 -At -f set_news.sql) || { echo "::error::DB 저장 실패"; exit 1; }
          STORED=$(psql "$PGURL" -At -c "select coalesce(jsonb_array_length(items), 0) from public.ictc_news where day = '$DAY'::date")
          echo "::notice title=DB 저장::$OUT · ictc_news($DAY) ${STORED:-0}건"
          echo "- $OUT · DB 에 ${STORED:-0}건 저장" >> "$GITHUB_STEP_SUMMARY"

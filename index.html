<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
<title>ICTC 일정 · 업무</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f2f4f6; --card: #ffffff; --card-2: #f7f8fa; --line: #e5e8eb;
    --text: #191f28; --text-2: #4e5968; --text-3: #8b95a1;
    --primary: #3182f6; --primary-soft: #e8f3ff; --primary-text: #1b64da;
    --red: #f04452; --red-soft: #ffeef0; --amber: #ff9500; --amber-soft: #fff4e5;
    --green: #02a262; --green-soft: #e6f6ef; --gray: #8b95a1; --gray-soft: #f2f4f6;
    --sat: #3182f6; --sun: #f04452;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.14);
    --radius: 18px; --radius-sm: 12px;
    /* 일정 카테고리 색 */
    --c-교육: #3182f6; --c-교육-soft: #e8f3ff;
    --c-평가: #f04452; --c-평가-soft: #ffeef0;
    --c-회의: #7c5cff; --c-회의-soft: #efebff;
    --c-방문: #02a262; --c-방문-soft: #e6f6ef;
    --c-출장: #ff9500; --c-출장-soft: #fff4e5;
    --c-기타: #8b95a1; --c-기타-soft: #f2f4f6;
    /* 업무 카테고리 색 */
    --t-교육운영: #3182f6; --t-교육운영-soft: #e8f3ff;
    --t-행정: #7c5cff; --t-행정-soft: #efebff;
    --t-시설장비: #ff9500; --t-시설장비-soft: #fff4e5;
    --t-대외협력: #02a262; --t-대외협력-soft: #e6f6ef;
    --t-예산: #f04452; --t-예산-soft: #ffeef0;
    --t-기타: #8b95a1; --t-기타-soft: #f2f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101217; --card: #191c22; --card-2: #22262e; --line: #2c313a;
      --text: #f2f4f6; --text-2: #b0b8c1; --text-3: #6b7684;
      --primary: #4a90ff; --primary-soft: #1b2a44; --primary-text: #8ab4ff;
      --red-soft: #3a1f23; --amber-soft: #3a2c15; --green-soft: #143225; --gray-soft: #262a32;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); --shadow-lg: 0 12px 40px rgba(0,0,0,.6);
      --c-교육: #5b9dff; --c-교육-soft: #1b2a44; --c-평가: #ff6b76; --c-평가-soft: #3a1f23;
      --c-회의: #a08cff; --c-회의-soft: #27224a; --c-방문: #2ec27e; --c-방문-soft: #143225;
      --c-출장: #ffab3d; --c-출장-soft: #3a2c15; --c-기타: #9aa4b2; --c-기타-soft: #262a32;
      --t-교육운영: #5b9dff; --t-교육운영-soft: #1b2a44; --t-행정: #a08cff; --t-행정-soft: #27224a;
      --t-시설장비: #ffab3d; --t-시설장비-soft: #3a2c15; --t-대외협력: #2ec27e; --t-대외협력-soft: #143225;
      --t-예산: #ff6b76; --t-예산-soft: #3a1f23; --t-기타: #9aa4b2; --t-기타-soft: #262a32;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--text); font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 15px; line-height: 1.5; letter-spacing: -0.2px; min-height: 100vh; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }

  /* ── 상단 바 ── */
  .appbar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); }
  .appbar-inner { max-width: 880px; margin: 0 auto; padding: 14px 20px 10px; }
  .appbar-row { display: flex; align-items: center; gap: 12px; }
  .back { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-2); margin-left: -8px; }
  .back:hover { background: var(--card-2); }
  .appbar h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
  .appbar .sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .appbar-right { margin-left: auto; display: flex; gap: 6px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--card-2); }
  .segment { margin-top: 12px; display: flex; background: var(--line); border-radius: 12px; padding: 3px; position: relative; }
  .segment button { flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--text-3); transition: color .2s; position: relative; z-index: 1; }
  .segment button.active { color: var(--text); }
  .segment .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: var(--card); border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); transition: transform .25s cubic-bezier(.4,0,.2,1); }
  .segment.right .thumb { transform: translateX(100%); }

  main { max-width: 880px; margin: 0 auto; padding: 8px 20px 0; }
  section { display: none; }
  section.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .summary { background: var(--card); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .summary .big { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1; }
  .summary .label { font-size: 13px; color: var(--text-3); margin-top: 2px; }
  .summary .stats { margin-left: auto; display: flex; gap: 14px; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 17px; font-weight: 700; }
  .stat span { font-size: 11px; color: var(--text-3); }
  .stat.c-진행중 b { color: var(--primary); } .stat.c-예정 b { color: var(--amber); } .stat.c-완료 b { color: var(--green); } .stat.c-보류 b { color: var(--gray); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; border: none; background: var(--card); color: var(--text-2); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; box-shadow: var(--shadow); transition: .15s; display: inline-flex; align-items: center; gap: 6px; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--text-3)); }
  .chip.active { background: var(--text); color: var(--card); }
  .chip .cnt { font-size: 11px; color: var(--text-3); font-weight: 600; }
  .chip.active .cnt { color: var(--card); opacity: .7; }
  .chip:active { transform: scale(.96); }

  /* ── 일정 ── */
  .month { font-size: 13px; font-weight: 700; color: var(--text-3); margin: 22px 4px 10px; }
  .month:first-child { margin-top: 4px; }
  .day { display: grid; grid-template-columns: 52px 1fr; gap: 12px; margin-bottom: 12px; }
  .day-col { text-align: center; padding-top: 8px; }
  .day-num { width: 40px; height: 40px; margin: 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; }
  .day.today .day-num { background: var(--primary); color: #fff; }
  .day-dow { font-size: 11px; color: var(--text-3); margin-top: 4px; font-weight: 600; }
  .day-dow.sat { color: var(--sat); } .day-dow.sun { color: var(--sun); }
  .day.past { opacity: .55; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .event { display: flex; align-items: stretch; position: relative; }
  .event + .event { border-top: 1px solid var(--line); }
  .event-bar { width: 4px; flex-shrink: 0; background: var(--cat, var(--c-기타)); margin: 10px 0 10px 10px; border-radius: 2px; }
  .event-time { width: 78px; flex-shrink: 0; padding: 14px 8px 14px 12px; font-size: 13px; font-weight: 600; color: var(--text-2); line-height: 1.45; font-variant-numeric: tabular-nums; border: none; background: transparent; text-align: left; border-radius: 10px; margin: 4px 0 4px 2px; transition: background .15s; }
  .event-time:hover { background: var(--card-2); color: var(--primary-text); }
  .event-time small { display: block; color: var(--text-3); font-weight: 500; }
  .event-time.allday { color: var(--text-3); }
  .event-main { flex: 1; min-width: 0; padding: 14px 14px 14px 6px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; border-radius: 10px; margin: 4px 4px 4px 0; transition: background .15s; }
  .event-main:hover { background: var(--card-2); }
  .event-body { flex: 1; min-width: 0; }
  .event-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .event-sub { font-size: 13px; color: var(--text-3); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--cat-soft, var(--c-기타-soft)); color: var(--cat, var(--c-기타)); letter-spacing: 0; }
  .chevron { color: var(--text-3); flex-shrink: 0; margin-top: 3px; }
  .cat-교육 { --cat: var(--c-교육); --cat-soft: var(--c-교육-soft); }
  .cat-평가 { --cat: var(--c-평가); --cat-soft: var(--c-평가-soft); }
  .cat-회의 { --cat: var(--c-회의); --cat-soft: var(--c-회의-soft); }
  .cat-방문 { --cat: var(--c-방문); --cat-soft: var(--c-방문-soft); }
  .cat-출장 { --cat: var(--c-출장); --cat-soft: var(--c-출장-soft); }
  .cat-기타 { --cat: var(--c-기타); --cat-soft: var(--c-기타-soft); }
  .tcat-교육운영 { --cat: var(--t-교육운영); --cat-soft: var(--t-교육운영-soft); }
  .tcat-행정 { --cat: var(--t-행정); --cat-soft: var(--t-행정-soft); }
  .tcat-시설장비 { --cat: var(--t-시설장비); --cat-soft: var(--t-시설장비-soft); }
  .tcat-대외협력 { --cat: var(--t-대외협력); --cat-soft: var(--t-대외협력-soft); }
  .tcat-예산 { --cat: var(--t-예산); --cat-soft: var(--t-예산-soft); }
  .tcat-기타 { --cat: var(--t-기타); --cat-soft: var(--t-기타-soft); }
  .filter-label { font-size: 11.5px; font-weight: 700; color: var(--text-3); margin: 2px 4px 6px; letter-spacing: .3px; }
  .chips + .filter-label { margin-top: 2px; }
  .chip .avatar { width: 18px; height: 18px; font-size: 9px; margin-right: 0; }

  /* ── 시간 팝오버 ── */
  .pop-bg { position: fixed; inset: 0; z-index: 90; display: none; }
  .pop-bg.open { display: block; }
  .pop { position: absolute; z-index: 91; background: var(--card); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 14px; width: 300px; display: none; animation: fade .15s ease; }
  .pop.open { display: block; }
  .pop h3 { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .pop h3 small { font-weight: 500; color: var(--text-3); }
  .pop .field { margin-bottom: 10px; }
  .pop .field input { padding: 10px 12px; font-size: 14px; }
  .pop .row { gap: 8px; }
  .pop-foot { display: flex; gap: 6px; margin-top: 4px; }
  .pop-foot .btn { padding: 10px; font-size: 14px; }
  .pop .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pop .quick button { border: 1px solid var(--line); background: transparent; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 5px 10px; }
  .pop .quick button:hover { background: var(--card-2); }
  @media (max-width: 640px) { .pop { position: fixed; left: 16px !important; right: 16px; width: auto; top: auto !important; bottom: calc(24px + env(safe-area-inset-bottom)); } }

  /* ── 업무 ── */
  .task-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .task { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: transform .15s, box-shadow .15s; position: relative; overflow: hidden; }
  .task::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--cat, var(--t-기타)); }
  .task:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .task-top { display: flex; align-items: center; gap: 8px; }
  .task-cat { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--cat-soft, var(--t-기타-soft)); color: var(--cat, var(--t-기타)); }
  .task-cat .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status { margin-left: auto; border: none; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status.s-진행중 { background: var(--primary-soft); color: var(--primary-text); }
  .status.s-예정 { background: var(--amber-soft); color: var(--amber); }
  .status.s-완료 { background: var(--green-soft); color: var(--green); }
  .status.s-보류 { background: var(--gray-soft); color: var(--gray); }
  .task-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
  .task.done .task-title { color: var(--text-3); text-decoration: line-through; }
  .task-detail { font-size: 13.5px; color: var(--text-2); line-height: 1.55; white-space: pre-wrap; }
  .task-foot { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--text-3); border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; }
  .task-foot .overdue { color: var(--red); font-weight: 700; }
  .avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-text); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; margin-right: 4px; }
  .empty { background: var(--card); border-radius: var(--radius); padding: 48px 20px; text-align: center; color: var(--text-3); font-size: 14px; }
  .empty .ico { font-size: 34px; margin-bottom: 8px; }

  .notice { display: flex; gap: 10px; align-items: flex-start; background: var(--primary-soft); color: var(--primary-text); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
  .notice svg { flex-shrink: 0; margin-top: 2px; }
  .notice .sync { color: var(--text-3); font-size: 12px; margin-left: 6px; white-space: nowrap; }
  .notice .sync.err { color: var(--red); }
  .notice .link-btn { border: none; background: var(--card); color: var(--primary-text); font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; margin-left: 6px; box-shadow: var(--shadow); white-space: nowrap; }
  .notice .link-btn.sub { background: transparent; box-shadow: none; font-weight: 500; color: var(--text-3); }

  .fab { position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 40; height: 52px; padding: 0 20px 0 16px; border-radius: 999px; border: none; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 8px 24px rgba(49,130,246,.4); transition: transform .15s; }
  .fab:active { transform: scale(.95); }
  @media (min-width: 880px) { .fab { right: calc(50% - 440px + 20px); } }

  /* ── 시트 ── */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 12px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); }
  .sheet-bg.open .sheet { transform: none; }
  .handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  .sheet h2 { font-size: 19px; font-weight: 700; margin-bottom: 18px; }
  @media (min-width: 640px) { .sheet-bg { align-items: center; } .sheet { border-radius: 24px; transform: translateY(20px) scale(.98); box-shadow: var(--shadow-lg); padding-top: 24px; } .handle { display: none; } }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
  .field input, .field select, .field textarea { width: 100%; background: var(--card-2); border: 1.5px solid transparent; border-radius: var(--radius-sm); color: var(--text); font: inherit; font-size: 15px; padding: 12px 14px; outline: none; transition: .15s; appearance: none; -webkit-appearance: none; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); background: var(--card); }
  .field textarea { min-height: 88px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .picker button { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
  .picker button .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); }
  .picker button.on { border-color: transparent; background: var(--cat-soft); color: var(--cat); }
  .picker button.on.s-진행중 { background: var(--primary-soft); color: var(--primary-text); }
  .picker button.on.s-예정 { background: var(--amber-soft); color: var(--amber); }
  .picker button.on.s-완료 { background: var(--green-soft); color: var(--green); }
  .picker button.on.s-보류 { background: var(--gray-soft); color: var(--gray); }
  .when-summary { display: none; align-items: center; justify-content: space-between; background: var(--card-2); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; font-size: 14px; font-weight: 600; }
  .when-summary button { border: none; background: transparent; color: var(--primary-text); font-size: 13px; font-weight: 700; }
  .sheet.compact .when-summary { display: flex; }
  .sheet.compact .when-fields { display: none; }
  .sheet-foot { display: flex; gap: 8px; margin-top: 18px; }
  .btn { flex: 1; border: none; border-radius: var(--radius-sm); padding: 14px; font-size: 15px; font-weight: 700; transition: .15s; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.ghost { background: var(--card-2); color: var(--text-2); }
  .btn.danger { background: var(--red-soft); color: var(--red); flex: 0 0 auto; padding: 14px 18px; }

  .menu { position: fixed; z-index: 60; background: var(--card); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 210px; display: none; }
  .menu.open { display: block; animation: fade .15s ease; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; text-align: left; padding: 11px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; }
  .menu button:hover { background: var(--card-2); }
  .menu button.danger { color: var(--red); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px); background: var(--text); color: var(--card); font-size: 14px; font-weight: 600; padding: 12px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .25s; z-index: 300; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* ── 잠금 화면 ── */
  .lock { position: fixed; inset: 0; z-index: 400; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
  .lock.open { display: flex; }
  .lock-card { background: var(--card); border-radius: 24px; box-shadow: var(--shadow-lg); padding: 32px 28px; width: 100%; max-width: 380px; text-align: center; animation: fade .25s ease; }
  .lock-ico { width: 56px; height: 56px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-text); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .lock h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .lock p { font-size: 13.5px; color: var(--text-3); margin: 6px 0 20px; line-height: 1.5; }
  .lock input { width: 100%; text-align: center; font-size: 22px; letter-spacing: 6px; font-weight: 700; background: var(--card-2); border: 1.5px solid transparent; border-radius: var(--radius-sm); padding: 14px; outline: none; color: var(--text); font-family: inherit; }
  .lock input:focus { border-color: var(--primary); background: var(--card); }
  .lock .err { color: var(--red); font-size: 13px; font-weight: 600; min-height: 18px; margin: 8px 0 4px; }
  .lock .btn { width: 100%; margin-top: 6px; }

  /* ── PC ── */
  .side-actions { display: none; }
  @media (min-width: 1024px) {
    body { padding-bottom: 60px; }
    .appbar-inner, main { max-width: 1240px; padding-left: 32px; padding-right: 32px; }
    .appbar-inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; padding-top: 12px; padding-bottom: 12px; }
    .appbar-row { grid-column: 1; } .appbar-right { grid-column: 3; justify-self: end; }
    .segment { grid-column: 2; grid-row: 1; margin-top: 0; width: 360px; }
    main { padding-top: 24px; }
    section.active { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
    .side { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 14px; }
    .summary { margin-bottom: 0; flex-direction: column; align-items: stretch; gap: 14px; padding: 22px; }
    .summary .big { font-size: 28px; }
    .summary .stats { margin-left: 0; justify-content: space-around; border-top: 1px solid var(--line); padding-top: 14px; }
    .chips { flex-wrap: wrap; padding: 0; overflow: visible; }
    .side-actions { display: flex; flex-direction: column; gap: 8px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; }
    .side-actions .btn { padding: 12px; font-size: 14px; }
    .side-actions .btn.primary { margin-bottom: 4px; }
    .side-actions .btn.ghost { font-weight: 600; }
    .side-actions .hint { font-size: 11.5px; color: var(--text-3); text-align: center; margin-top: 2px; }
    .side-actions kbd { font: inherit; background: var(--card-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
    .fab { display: none; }
    .toast { bottom: 32px; }
    .day { grid-template-columns: 60px 1fr; gap: 16px; margin-bottom: 14px; }
    .event-time { width: 92px; font-size: 14px; padding-left: 14px; }
    .event-main { padding: 16px 18px 16px 8px; }
    .task-list { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .notice { margin-bottom: 20px; }
  }
  @media (min-width: 1400px) { .appbar-inner, main { max-width: 1400px; } .task-list { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) {
    .appbar-inner, main { padding-left: 16px; padding-right: 16px; }
    .task-list { grid-template-columns: 1fr; }
    .summary .stats { gap: 10px; }
    .event-time { width: 66px; padding-left: 8px; font-size: 12.5px; }
  }
</style>
</head>
<body>

<div class="appbar">
  <div class="appbar-inner">
    <div class="appbar-row">
      <a class="back" href="checklist/" aria-label="현장지휘관 체크리스트" title="현장지휘관 체크리스트"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></a>
      <div><h1>ICTC 일정 · 업무</h1><div class="sub">인천소방학교 · 팀 공유 보드</div></div>
      <div class="appbar-right">
        <button class="icon-btn" id="menuBtn" aria-label="더보기" onclick="toggleMenu(event)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
      </div>
    </div>
    <div class="segment" id="segment">
      <div class="thumb"></div>
      <button class="active" data-tab="schedule" onclick="showTab('schedule')">일정표</button>
      <button data-tab="tasks" onclick="showTab('tasks')">주요업무</button>

  </div>
</div>

<main>
  <div class="notice" id="notice"></div>

  <section id="schedule" class="active">
    <aside class="side">
      <div class="summary" id="scheduleSummary"></div>
      <div class="chips" id="scheduleFilters"></div>
      <div class="side-actions">
        <button class="btn primary" onclick="openScheduleForm()">+ 일정 추가</button>
        <button class="btn ghost" onclick="exportJSON('schedule')">JSON 내보내기</button>
        <button class="btn ghost" onclick="importJSON('schedule')">JSON 가져오기</button>
        <div class="hint"><kbd>N</kbd> 새 항목 · <kbd>1</kbd>/<kbd>2</kbd> 탭 전환</div>
      </div>
    </aside>
    <div class="content" id="scheduleList"></div>
  </section>

  <section id="tasks">
    <aside class="side">
      <div class="summary" id="tasksSummary"></div>
      <div class="filter-label">상태</div>
      <div class="chips" id="tasksFilters"></div>
      <div class="filter-label">분류</div>
      <div class="chips" id="tasksCatFilters"></div>
      <div class="filter-label">담당자</div>
      <div class="chips" id="tasksOwnerFilters"></div>
      <div class="side-actions">
        <button class="btn primary" onclick="openTaskForm()">+ 업무 추가</button>
        <button class="btn ghost" onclick="exportJSON('tasks')">JSON 내보내기</button>
        <button class="btn ghost" onclick="importJSON('tasks')">JSON 가져오기</button>
        <div class="hint"><kbd>N</kbd> 새 항목 · <kbd>1</kbd>/<kbd>2</kbd> 탭 전환</div>
      </div>
    </aside>
    <div class="content task-list" id="taskList"></div>
  </section>
</main>

<button class="fab" id="fab" onclick="fabClick()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fabLabel">일정 추가</span></button>

<div class="menu" id="menu">
  <button onclick="exportJSON(currentTab())">⬇️&nbsp; JSON 내보내기</button>
  <button onclick="importJSON(currentTab())">⬆️&nbsp; JSON 가져오기</button>
  <hr>
  <button id="menuPin" style="display:none" onclick="changePin()">🔑&nbsp; 편집 PIN 입력/변경</button>
  <button id="menuViewPin" style="display:none" onclick="changeViewPin()">👁️&nbsp; 조회 PIN 다시 입력</button>
  <button class="danger" id="menuReset" onclick="resetToDefault(currentTab())">↺&nbsp; 기본값으로 복원</button>
</div>

<!-- 시간 변경 팝오버 -->
<div class="pop-bg" id="popBg" onclick="closePop()"></div>
<form class="pop" id="pop" onsubmit="saveWhen(event)">
  <h3>일시 변경 <small id="popTitle"></small></h3>
  <input type="hidden" name="id">
  <div class="quick">
    <button type="button" onclick="shiftDate(-1)">하루 전</button>
    <button type="button" onclick="shiftDate(1)">하루 뒤</button>
    <button type="button" onclick="shiftDate(7)">일주일 뒤</button>
    <button type="button" onclick="clearTime()">종일</button>
  </div>
  <div class="field"><input name="date" type="date" required></div>
  <div class="row">
    <div class="field"><input name="start" type="time" aria-label="시작"></div>
    <div class="field"><input name="end" type="time" aria-label="종료"></div>
  </div>
  <div class="pop-foot">
    <button type="button" class="btn ghost" onclick="closePop()">취소</button>
    <button type="submit" class="btn primary">저장</button>
  </div>
</form>

<!-- 일정 시트 -->
<div class="sheet-bg" id="scheduleModal" onclick="if(event.target===this)closeModal('scheduleModal')">
  <form class="sheet" id="scheduleForm" onsubmit="saveSchedule(event)">
    <div class="handle"></div>
    <h2 id="scheduleFormTitle">일정 추가</h2>
    <input type="hidden" name="id"><input type="hidden" name="tag" value="기타">
    <div class="field"><label>제목</label><input name="title" required maxlength="100" placeholder="예) 현장지휘관 양성과정 1일차"></div>
    <div class="field"><label>구분</label><div class="picker" id="catPicker"></div></div>
    <div class="when-summary"><span id="whenText"></span><button type="button" onclick="expandWhen()">일시 변경</button></div>
    <div class="when-fields">
      <div class="field"><label>날짜</label><input name="date" type="date" required></div>
      <div class="row">
        <div class="field"><label>시작</label><input name="start" type="time"></div>
        <div class="field"><label>종료</label><input name="end" type="time"></div>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>장소</label><input name="place" maxlength="60"></div>
      <div class="field"><label>담당</label><input name="owner" maxlength="30"></div>
    </div>
    <div class="field"><label>메모</label><textarea name="note" maxlength="500"></textarea></div>

      <button type="button" class="btn danger" id="scheduleDelete" onclick="deleteItem('schedule')">삭제</button>

</div>

<!-- 업무 시트 -->
<div class="sheet-bg" id="taskModal" onclick="if(event.target===this)closeModal('taskModal')">
  <form class="sheet" id="taskForm" onsubmit="saveTask(event)">
    <div class="handle"></div>
    <h2 id="taskFormTitle">업무 추가</h2>
    <input type="hidden" name="id"><input type="hidden" name="status" value="예정"><input type="hidden" name="category" value="기타">
    <div class="field"><label>업무명</label><input name="title" required maxlength="100" placeholder="예) 2027년 교육계획 수립"></div>

      <button type="submit" class="btn primary">저장</button>

</div>

<div class="lock" id="lock">
  <form class="lock-card" onsubmit="submitViewPin(event)">
    <div class="lock-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h2>ICTC 일정 · 업무</h2>
    <p>팀 조회 PIN을 입력하세요.<br>이 기기에 한 번만 저장됩니다.</p>
    <input id="viewPinInput" inputmode="numeric" autocomplete="off" placeholder="조회 PIN" required>
    <div class="err" id="lockErr"></div>
    <button type="submit" class="btn primary">들어가기</button>
  </form>
</div>
<input type="file" id="fileInput" accept="application/json,.json" style="display:none">
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
  const DOW = ['일','월','화','수','목','금','토'];
  const CATEGORIES = ['교육', '평가', '회의', '방문', '출장', '기타'];
  const LEGACY_CAT = { '실습': '교육', '점검': '기타', '행사': '기타' };
  const TASK_CATEGORIES = ['교육운영', '행정', '시설장비', '대외협력', '예산', '기타'];
  const STATUSES = ['예정', '진행중', '완료', '보류'];
  const STATUS_ORDER = { '진행중': 0, '예정': 1, '보류': 2, '완료': 3 };
  const LS_KEY = { schedule: 'ictc.schedule.v1', tasks: 'ictc.tasks.v1', pin: 'ictc.pin', viewPin: 'ictc.viewPin', server: 'ictc.serverUrl' };
  const FILE = { schedule: 'data/schedule.json', tasks: 'data/tasks.json' };
  const CFG = window.ICTC_CONFIG || {};
  const SUPABASE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
  const LOCALSRV = typeof CFG.apiUrl === 'string';   // 로컬(D드라이브) 서버 모드
  const REMOTE = SUPABASE || LOCALSRV;               // 팀 공유 모드 여부
  const state = { schedule: null, tasks: null, scheduleTag: '전체', taskStatus: '전체', taskCat: '전체', taskOwner: '전체', source: {}, lastSync: null };

  const TODAY = (() => { const d = new Date(); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); })();
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const initial = s => (s || '').trim().charAt(0) || '?';
  const catOf = ev => CATEGORIES.includes(ev.tag) ? ev.tag : (LEGACY_CAT[ev.tag] || '기타');
  const tcatOf = t => TASK_CATEGORIES.includes(t.category) ? t.category : '기타';
  const fmtTime = iso => { if (!iso) return '-'; const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  const fmtWhen = ev => { if (!ev.date) return ''; const d = new Date(ev.date + 'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]}) ${ev.start ? ev.start + (ev.end ? ' – ' + ev.end : '') : '종일'}`; };

  let toastTimer;
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
  function currentTab() { return document.querySelector('section.active').id; }
  function showTab(name) {
    document.querySelectorAll('.segment button').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.getElementById('segment').classList.toggle('right', name === 'tasks');
    document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === name));
    document.getElementById('fabLabel').textContent = name === 'schedule' ? '일정 추가' : '업무 추가';
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
  }
  function fabClick() { currentTab() === 'schedule' ? openScheduleForm() : openTaskForm(); }
  function toggleMenu(e) {
    e.stopPropagation();
    const m = document.getElementById('menu'); const r = e.currentTarget.getBoundingClientRect();
    m.style.top = (r.bottom + 6) + 'px'; m.style.right = (window.innerWidth - r.right) + 'px';
    m.classList.toggle('open');
  }
  document.addEventListener('click', () => document.getElementById('menu').classList.remove('open'));

  /* ── 로컬 저장 ── */
  function lsGet(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } }
  function lsDel(key) { try { localStorage.removeItem(key); } catch (e) {} }
  function normalize(data) {
    if (!data || !Array.isArray(data.items)) throw new Error('items 배열이 없습니다');
    data.items.forEach(i => { if (!i.id) i.id = uid(); }); return data;
  }
  async function loadDefault(kind) {
    const res = await fetch(FILE[kind], { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status); return normalize(await res.json());
  }

  /* ── 공유 저장소 어댑터 (로컬 서버 / Supabase) ── */
  async function readError(res) {
    let msg = '서버 오류 ' + res.status;
    try { const j = await res.json(); msg = j.message || j.hint || msg; } catch (e) {}
    if (/PIN_INVALID/.test(msg)) { lsDel(LS_KEY.pin); return new Error('PIN이 올바르지 않습니다'); }
    return new Error(msg);
  }
  const rowsToState = rows => ({ updated: rows[0]?.updated_at || null, items: rows.map(r => r.data) });
  const viewPin = () => lsGet(LS_KEY.viewPin) || lsGet(LS_KEY.pin) || '';
  class ViewPinError extends Error { constructor(required) { super(required ? '조회 PIN이 필요합니다' : '조회 PIN이 올바르지 않습니다'); this.viewPin = true; } }
  async function readListError(res) {
    let msg = '';
    try { const j = await res.json(); msg = j.message || j.hint || ''; } catch (e) {}
    if (/VIEW_PIN_REQUIRED/.test(msg)) return new ViewPinError(true);
    if (/VIEW_PIN_INVALID/.test(msg)) { lsDel(LS_KEY.viewPin); return new ViewPinError(false); }
    return new Error(msg || '서버 응답 ' + res.status);
  }
  const api = LOCALSRV ? {
    async fetchAll(kind) {
      const res = await fetch(`${CFG.apiUrl}/api/items?kind=${kind}`, { cache: 'no-store', headers: { 'X-Pin': viewPin() } });
      if (!res.ok) throw await readListError(res);
      return rowsToState(await res.json());
    },
    async call(fn, pin, kind, payload) {
      const res = await fetch(`${CFG.apiUrl}/api/${fn}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin, kind, ...payload }) });
      if (!res.ok) throw await readError(res);
    }
  } : {
    headers: () => ({ apikey: CFG.supabaseAnonKey, Authorization: 'Bearer ' + CFG.supabaseAnonKey, 'Content-Type': 'application/json' }),
    async fetchAll(kind) {
      const res = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/ictc_list`, { method: 'POST', headers: this.headers(), cache: 'no-store', body: JSON.stringify({ p_pin: viewPin(), p_kind: kind }) });
      if (!res.ok) throw await readListError(res);
      return rowsToState(await res.json());
    },
    async call(fn, pin, kind, payload) {
      const map = { save: ['ictc_save', { p_item: payload.item }], delete: ['ictc_delete', { p_id: payload.id }], replace: ['ictc_replace', { p_items: payload.items }] };
      const [rpc, extra] = map[fn];
      const res = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${rpc}`, { method: 'POST', headers: this.headers(), body: JSON.stringify({ p_pin: pin, p_kind: kind, ...extra }) });
      if (!res.ok) throw await readError(res);
    }
  };
  function getPin(force) {
    let pin = force ? null : (lsGet(LS_KEY.pin) || null);
    if (!pin) {
      pin = prompt('편집 PIN을 입력하세요 (팀 담당자에게 문의)');
      if (!pin) return null;
      pin = pin.trim(); lsSet(LS_KEY.pin, pin);
    }
    return pin;
  }
  function changePin() { if (getPin(true)) { toast('PIN을 저장했어요'); renderNotice(); } }
  /* ── 조회 PIN 잠금 화면 ── */
  function showLock(msg) {
    const l = document.getElementById('lock'); l.classList.add('open');
    document.getElementById('lockErr').textContent = msg || '';
    const i = document.getElementById('viewPinInput'); i.value = ''; setTimeout(() => i.focus(), 50);
  }
  function hideLock() { document.getElementById('lock').classList.remove('open'); }
  async function submitViewPin(e) {
    e.preventDefault();
    const v = document.getElementById('viewPinInput').value.trim(); if (!v) return;
    lsSet(LS_KEY.viewPin, v);
    try { await api.fetchAll('schedule'); hideLock(); await init('schedule'); await init('tasks'); }
    catch (err) { lsDel(LS_KEY.viewPin); showLock(err.viewPin ? '조회 PIN이 올바르지 않습니다' : '연결 실패: ' + err.message); }
  }
  function changeViewPin() { lsDel(LS_KEY.viewPin); showLock(); }
  function setServer() {
    const cur = lsGet(LS_KEY.server) || 'http://192.168.0.10:8080';
    let v = prompt('사내 서버 주소를 입력하세요 (start.bat 창의 "팀원 접속" 주소)', cur);
    if (v == null) return;

  function goServer() { const v = lsGet(LS_KEY.server); if (v) location.href = v + (location.hash || ''); }

  /* ── 공통 저장 계층 ── */
  async function withPin(fn) {

  }
  async function saveItem(kind, item) {
    if (REMOTE) {
      if (!await withPin(pin => api.call('save', pin, kind, { item }))) return false;
      await refresh(kind, true); return true;
    }
    const items = state[kind].items, idx = items.findIndex(i => i.id === item.id);
    idx >= 0 ? items[idx] = item : items.push(item);
    persistLocal(kind); return true;
  }
  async function removeItem(kind, id) {
    if (REMOTE) {
      if (!await withPin(pin => api.call('delete', pin, kind, { id }))) return false;
      await refresh(kind, true); return true;
    }
    state[kind].items = state[kind].items.filter(i => i.id !== id); persistLocal(kind); return true;
  }
  async function replaceAll(kind, items) {
    if (REMOTE) {

      await refresh(kind, true); return true;
    }

  }
  function persistLocal(kind) {

    } catch (e) {
      if (e.viewPin) { showLock(lsGet(LS_KEY.viewPin) === null && silent ? '' : e.message === '조회 PIN이 필요합니다' ? '' : e.message); return; }
      if (!state[kind]) { state[kind] = { updated: null, items: [] }; state.source[kind] = 'error'; render(kind); }
      if (!silent) toast('불러오기 실패: ' + e.message);
      setSyncStatus('연결 안 됨 · ' + e.message, true);

  }
  async function init(kind) {
    if (REMOTE) { await refresh(kind); return; }

    else {
      try { state[kind] = await loadDefault(kind); state.source[kind] = 'file'; }
      catch (e) { state[kind] = { updated: TODAY, items: [] }; state.source[kind] = 'empty'; }

  }
  function render(kind) { kind === 'schedule' ? renderSchedule() : renderTasks(); renderNotice(); }
  function setSyncStatus(text, isError) { const el = document.getElementById('syncStatus'); if (el) { el.textContent = text; el.classList.toggle('err', !!isError); } }
  function renderNotice() {
    const ico = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
    const n = document.getElementById('notice');
    if (REMOTE) {

      n.innerHTML = ico + `<span><b>팀 공유 모드${LOCALSRV ? ' (사내 서버)' : ''}</b> · 여기서 저장한 내용은 모든 팀원에게 바로 보입니다. ${hasPin ? '편집 PIN 저장됨.' : '편집하려면 PIN이 필요합니다.'} <span id="syncStatus" class="sync">${state.lastSync ? '마지막 동기화 ' + fmtTime(state.lastSync) : '동기화 중…'}</span></span>`;

    n.innerHTML = ico + (anyLocal
      ? `<span>이 브라우저에 저장된 수정본입니다(개인용). 팀 공유 데이터는 사내 서버에서 보세요. ${bridge}</span>`
      : `<span>미리보기 모드입니다. 여기서 수정한 내용은 <b>이 브라우저에만</b> 저장됩니다. 팀 공유 데이터는 사내 서버에서 보세요. ${bridge}</span>`);

  function fillDatalist(id, values) { document.getElementById(id).innerHTML = [...new Set(values.filter(Boolean))].map(v => `<option value="${esc(v)}">`).join(''); }
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  /* ── 일정 ── */
  function renderSchedule() {
    const data = state.schedule, list = document.getElementById('scheduleList');
    const upcoming = data.items.filter(i => i.date >= TODAY).length;
    const todayCnt = data.items.filter(i => i.date === TODAY).length;
    const d = new Date();
    document.getElementById('scheduleSummary').innerHTML = `
      <div><div class="big">${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일</div><div class="label">오늘 일정 ${todayCnt}건</div></div>
      <div class="stats"><div class="stat"><b>${upcoming}</b><span>예정</span></div><div class="stat"><b>${data.items.length}</b><span>전체</span></div></div>`;
    const counts = {}; data.items.forEach(i => { const c = catOf(i); counts[c] = (counts[c] || 0) + 1; });
    renderChips(document.getElementById('scheduleFilters'), CATEGORIES.map(c => ({ key: c, color: catColor(c), count: counts[c] || 0 })), state.scheduleTag, t => { state.scheduleTag = t; renderSchedule(); });

      .slice().sort((a, b) => (a.date + (a.start || '')).localeCompare(b.date + (b.start || '')));

        : '<div class="empty"><div class="ico">📅</div>표시할 일정이 없어요<br>버튼을 눌러 일정을 추가해 보세요</div>';

        html += `<div class="event cat-${cat}">
          <div class="event-bar"></div>

          <div class="event-main" title="내용 수정" onclick="openScheduleForm('${esc(ev.id)}', 'detail')">
            <div class="event-body"><div class="event-title">${esc(ev.title)}<span class="pill">${esc(cat)}</span></div>

            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div></div>`;

  /* ── 시간 팝오버 ── */
  function openPop(id, anchor) {
    const ev = state.schedule.items.find(i => i.id === id); if (!ev) return;
    const pop = document.getElementById('pop'); pop.reset();
    pop.elements.id.value = id; pop.elements.date.value = ev.date || TODAY; pop.elements.start.value = ev.start || ''; pop.elements.end.value = ev.end || '';
    document.getElementById('popTitle').textContent = ev.title.length > 14 ? ev.title.slice(0, 14) + '…' : ev.title;
    document.getElementById('popBg').classList.add('open'); pop.classList.add('open');
    const r = anchor.getBoundingClientRect(); const W = 300, H = pop.offsetHeight || 230;
    let left = r.left + window.scrollX, top = r.bottom + 6 + window.scrollY;
    if (r.left + W > window.innerWidth - 12) left = window.innerWidth - W - 12 + window.scrollX;
    if (r.bottom + H > window.innerHeight - 12) top = r.top - H - 6 + window.scrollY;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
    setTimeout(() => pop.elements.date.focus(), 50);
  }

  function shiftDate(days) {
    const f = document.getElementById('pop').elements.date; const d = new Date((f.value || TODAY) + 'T00:00:00'); d.setDate(d.getDate() + days);
    f.value = [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  }

  async function saveWhen(e) {

  /* ── 업무 ── */
  function renderTasks() {
    const data = state.tasks, list = document.getElementById('taskList');
    const counts = {}; data.items.forEach(i => counts[i.status] = (counts[i.status] || 0) + 1);
    const overdueCnt = data.items.filter(t => t.due && t.due < TODAY && t.status !== '완료').length;
    document.getElementById('tasksSummary').innerHTML = `
      <div><div class="big">${counts['진행중'] || 0}건 진행중</div><div class="label">${overdueCnt ? `<span style="color:var(--red);font-weight:600">기한 지연 ${overdueCnt}건</span>` : '지연된 업무 없음'}</div></div>
      <div class="stats">${STATUSES.filter(s => s !== '진행중').map(s => `<div class="stat c-${s}"><b>${counts[s] || 0}</b><span>${s}</span></div>`).join('')}</div>`;
    fillDatalist('ownerList', data.items.map(i => i.owner));
    const statuses = STATUSES.filter(s => counts[s]);
    if (state.taskStatus !== '전체' && !statuses.includes(state.taskStatus)) state.taskStatus = '전체';
    renderChips(document.getElementById('tasksFilters'), statuses.map(s => ({ key: s, count: counts[s] })), state.taskStatus, s => { state.taskStatus = s; renderTasks(); });
    const catCounts = {}; data.items.forEach(i => { const c = tcatOf(i); catCounts[c] = (catCounts[c] || 0) + 1; });
    renderChips(document.getElementById('tasksCatFilters'), TASK_CATEGORIES.map(c => ({ key: c, color: tcatColor(c), count: catCounts[c] || 0 })), state.taskCat, c => { state.taskCat = c; renderTasks(); });
    const ownerCounts = {}; data.items.forEach(i => { const o = (i.owner || '').trim() || '미지정'; ownerCounts[o] = (ownerCounts[o] || 0) + 1; });
    const owners = Object.keys(ownerCounts).sort((a, b) => ownerCounts[b] - ownerCounts[a] || a.localeCompare(b, 'ko'));
    if (state.taskOwner !== '전체' && !owners.includes(state.taskOwner)) state.taskOwner = '전체';
    renderChips(document.getElementById('tasksOwnerFilters'), owners.map(o => ({ key: o, avatar: true, count: ownerCounts[o] })), state.taskOwner, o => { state.taskOwner = o; renderTasks(); });

    const items = data.items.filter(i => (state.taskStatus === '전체' || i.status === state.taskStatus)
        && (state.taskCat === '전체' || tcatOf(i) === state.taskCat)
        && (state.taskOwner === '전체' || ((i.owner || '').trim() || '미지정') === state.taskOwner)).slice()
      .sort((a, b) => (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9) || (a.due || '9999').localeCompare(b.due || '9999'));
    if (!items.length) {
      list.innerHTML = state.source.tasks === 'error'
        ? '<div class="empty" style="grid-column:1/-1"><div class="ico">⚠️</div>서버에 연결하지 못했어요<br>서버가 켜져 있는지, 같은 네트워크인지 확인해 주세요</div>'
        : '<div class="empty" style="grid-column:1/-1"><div class="ico">✅</div>표시할 업무가 없어요<br>필터를 바꾸거나 버튼을 눌러 업무를 추가해 보세요</div>';

        <div class="task-top"><span class="task-cat"><span class="dot"></span>${esc(tc)}</span>
          <button class="status s-${esc(t.status)}" title="클릭하면 다음 상태로" onclick="event.stopPropagation();cycleStatus('${esc(t.id)}')">${esc(t.status)}</button></div>

  /* ── 내보내기 / 가져오기 / 복원 ── */
  function exportJSON(kind) {
    const blob = new Blob([JSON.stringify({ updated: TODAY, items: state[kind].items }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = kind + '.json';

  }

      r.onload = async () => {
        try {
          const data = normalize(JSON.parse(r.result));
          if (!confirm(`현재 ${state[kind].items.length}건을 파일의 ${data.items.length}건으로 교체할까요?${REMOTE ? '\n(팀 전체 데이터가 바뀝니다)' : ''}`)) return;

    lsDel(LS_KEY[kind]);
    try { state[kind] = await loadDefault(kind); state.source[kind] = 'file'; }
    catch (e) { state[kind] = { updated: TODAY, items: [] }; state.source[kind] = 'empty'; }
    render(kind); toast('기본값으로 복원했어요');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { document.querySelectorAll('.sheet-bg.open').forEach(m => m.classList.remove('open')); closePop(); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.querySelector('.sheet-bg.open, .pop.open');
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); fabClick(); }
    else if (e.key === '1') showTab('schedule');
    else if (e.key === '2') showTab('tasks');
  });

  if (REMOTE) {
    document.getElementById('menuPin').style.display = '';
    document.getElementById('menuViewPin').style.display = '';
    document.getElementById('menuReset').textContent = '🔄  서버에서 새로고침';
    const every = Math.max(10, Number(CFG.pollSeconds) || 30) * 1000;
    const busy = () => document.hidden || document.querySelector('.sheet-bg.open, .pop.open');
    setInterval(() => { if (!busy()) { refresh('schedule', true); refresh('tasks', true); } }, every);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh('schedule', true); refresh('tasks', true); } });
  }
  if (location.hash === '#tasks') showTab('tasks');
  init('schedule'); init('tasks');
</script>
</body>
</html>
